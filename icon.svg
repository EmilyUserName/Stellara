<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0b1628" rx="100"/>
  <defs>
    <mask id="crescent-mask">
      <rect width="512" height="512" fill="white"/>
      <circle cx="330" cy="230" r="185" fill="black"/>
    </mask>
  </defs>
  <!-- Filled crescent opening to the right (☽ style) -->
  <circle cx="240" cy="256" r="200" fill="#f0f4ff" mask="url(#crescent-mask)"/>
  <!-- Small 4-pointed star in the concave area -->
  <polygon points="422,210 408,248 365,256 408,264 422,302 436,264 479,256 436,248" fill="#f0f4ff"/>
</svg>
