<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stellara — Your Personal Cosmos</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --navy: #060d1f;
    --navy-2: #0b1630;
    --navy-3: #111e40;
    --silver: #b8c4d8;
    --silver-light: #dce4f0;
    --silver-bright: #eef2f9;
    --accent: #7ea8d4;
    --accent-glow: rgba(126,168,212,0.18);
    --gold: #c8a96e;
    --white: #f5f8ff;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--navy);
    color: var(--silver-light);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Starfield */
  .starfield {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(30,60,120,0.35) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(15,30,80,0.4) 0%, transparent 60%),
      var(--navy);
  }
  .starfield::before, .starfield::after {
    content:''; position:absolute; inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 40% 10%, rgba(200,210,255,0.8) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 70%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 30%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 85% 55%, rgba(200,220,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 75%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 85%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 60%, rgba(200,210,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 90%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 48% 48%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 75%, rgba(200,220,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 18% 92%, rgba(255,255,255,0.4) 0%, transparent 100%);
    animation: twinkle 8s ease-in-out infinite alternate;
  }
  .starfield::after {
    background-image:
      radial-gradient(1px 1px at 30% 20%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 65% 15%, rgba(200,220,255,0.6) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 55%, rgba(200,210,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 95% 30%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 8% 35%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 72% 65%, rgba(200,220,255,0.6) 0%, transparent 100%);
    animation-delay: -4s;
  }
  @keyframes twinkle {
    0% { opacity:0.6; } 100% { opacity:1; }
  }

  /* Layout */
  .container {
    position: relative; z-index: 1;
    max-width: 760px; margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* Header */
  header {
    text-align: center;
    padding: 60px 0 48px;
    animation: fadeDown 0.8s ease both;
  }
  .logo-symbol {
    font-size: 2rem; margin-bottom: 12px;
    filter: drop-shadow(0 0 12px rgba(126,168,212,0.6));
    display: inline-block;
    animation: rotateSlow 30s linear infinite;
  }
  @keyframes rotateSlow { to { transform: rotate(360deg); } }
  header h1 {
    font-family: 'Barlow', sans-serif;
    font-size: clamp(2.8rem, 6vw, 4.2rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--white);
    text-transform: lowercase;
  }
  header p {
    margin-top: 10px;
    font-size: 0.82rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 300;
  }

  @keyframes fadeDown {
    from { opacity:0; transform: translateY(-20px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* Card */
  .card {
    background: rgba(11,22,48,0.7);
    border: 1px solid rgba(126,168,212,0.15);
    border-radius: 16px;
    padding: 40px;
    backdrop-filter: blur(12px);
    animation: fadeUp 0.8s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(24px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .card-title {
    font-family: 'Barlow', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--white);
    margin-bottom: 28px;
    display: flex; align-items: center; gap: 10px;
  }
  .card-title span { color: var(--accent); font-size: 1rem; }

  /* Form */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .form-grid .full { grid-column: 1 / -1; }

  label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 7px;
    font-weight: 500;
  }

  input, select {
    width: 100%;
    background: rgba(6,13,31,0.7);
    border: 1px solid rgba(126,168,212,0.2);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
  }
  input::placeholder { color: rgba(184,196,216,0.35); }
  input:focus, select:focus {
    border-color: rgba(126,168,212,0.5);
    box-shadow: 0 0 0 3px rgba(126,168,212,0.08);
  }
  select option { background: var(--navy-2); }

  .btn {
    width: 100%;
    margin-top: 28px;
    padding: 15px;
    background: linear-gradient(135deg, rgba(126,168,212,0.15), rgba(126,168,212,0.08));
    border: 1px solid rgba(126,168,212,0.35);
    border-radius: 10px;
    color: var(--white);
    font-family: 'Barlow', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    position: relative; overflow: hidden;
  }
  .btn:hover {
    background: linear-gradient(135deg, rgba(126,168,212,0.25), rgba(126,168,212,0.14));
    border-color: rgba(126,168,212,0.6);
    box-shadow: 0 0 24px rgba(126,168,212,0.15);
    transform: translateY(-1px);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Loading */
  .loading {
    display: none; text-align: center; padding: 40px 0;
  }
  .loading.active { display: block; }
  .orbit {
    width: 48px; height: 48px;
    border: 1.5px solid rgba(126,168,212,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p {
    font-size: 0.75rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent);
  }

  /* Results */
  .results { display: none; animation: fadeUp 0.6s ease both; }
  .results.active { display: block; }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(126,168,212,0.25), transparent);
    margin: 32px 0;
  }

  /* Placements row */
  .placements {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .placement-card {
    background: rgba(6,13,31,0.5);
    border: 1px solid rgba(126,168,212,0.12);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .placement-label {
    font-size: 0.65rem; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--accent);
    margin-bottom: 6px;
  }
  .placement-value {
    font-family: 'Barlow', sans-serif;
    font-size: 1.25rem; font-weight: 700;
    color: var(--white);
  }
  .placement-emoji { font-size: 1.1rem; margin-bottom: 4px; }

  /* Section */
  .section-label {
    font-size: 0.65rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--gold);
    margin-bottom: 14px; font-weight: 500;
  }

  .insight-text {
    font-family: 'Barlow', sans-serif;
    font-size: 1.05rem; font-weight: 400;
    line-height: 1.9;
    color: var(--silver-light);
    white-space: pre-wrap;
  }

  /* Today card */
  .today-card {
    margin-top: 32px;
    background: rgba(126,168,212,0.05);
    border: 1px solid rgba(126,168,212,0.18);
    border-radius: 12px;
    padding: 28px 32px;
  }
  .today-header {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .today-date {
    font-size: 0.7rem; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--silver);
  }

  .reset-btn {
    margin-top: 28px;
    background: none;
    border: 1px solid rgba(126,168,212,0.18);
    border-radius: 8px;
    padding: 10px 22px;
    color: var(--silver);
    font-family: 'Barlow', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover { border-color: rgba(126,168,212,0.4); color: var(--white); }

  /* Error */
  .error {
    display: none; text-align: center;
    padding: 20px; color: #e08080;
    font-size: 0.85rem;
  }
  .error.active { display: block; }

  @media (max-width: 520px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-grid .full { grid-column: 1; }
    .placements { grid-template-columns: 1fr; }
    .card { padding: 28px 20px; }
  }
</style>
</head>
<body>

<div class="starfield"></div>

<div class="container">
  <header>
    <div class="logo-symbol">✦</div>
    <h1>Stellara</h1>
    <p>Your Personal Cosmos</p>
  </header>

  <!-- Input Card -->
  <div class="card" id="inputCard">
    <div class="card-title"><span>✦</span> Birth Chart & Daily Transits</div>

    <div class="form-grid">
      <div class="full">
        <label>Your Name</label>
        <input type="text" id="name" placeholder="e.g. Emily" />
      </div>
      <div>
        <label>Birth Date</label>
        <input type="date" id="birthDate" />
      </div>
      <div>
        <label>Birth Time</label>
        <input type="time" id="birthTime" placeholder="HH:MM" />
      </div>
      <div class="full">
        <label>Birth City</label>
        <input type="text" id="birthCity" placeholder="e.g. New York, NY" />
      </div>
    </div>

    <button class="btn" id="revealBtn" onclick="reveal()">✦ &nbsp;Reveal My Chart</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="orbit"></div>
    <p>Reading the stars…</p>
  </div>

  <!-- Results -->
  <div class="results card" id="results" style="margin-top:24px;">
    <div class="card-title"><span>✦</span> <span id="resultName"></span>'s Birth Chart</div>

    <div class="placements" id="placements"></div>

    <div class="section-label">Your Cosmic Blueprint</div>
    <div class="insight-text" id="chartReading"></div>

    <div class="divider"></div>

    <div class="today-card">
      <div class="today-header">
        <div class="card-title" style="margin:0;font-size:1.1rem;"><span>☽</span> Today's Transits</div>
        <div class="today-date" id="todayDate"></div>
      </div>
      <div class="section-label">How the sky speaks to your chart today</div>
      <div class="insight-text" id="transitReading"></div>
    </div>

    <div style="text-align:center;">
      <button class="reset-btn" onclick="reset()">← Read Another Chart</button>
    </div>
  </div>
</div>

<script>
const SIGNS = ["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
const SIGN_EMOJI = ["♈","♉","♊","♋","♌","♍","♎","♏","♐","♑","♒","♓"];

function getSunSign(month, day) {
  const dates = [[1,20],[2,19],[3,21],[4,20],[5,21],[6,21],[7,23],[8,23],[9,23],[10,23],[11,22],[12,22]];
  for (let i = 0; i < 12; i++) {
    const [m, d] = dates[i];
    if ((month === m && day >= d) || (month === (m % 12) + 1 && day < dates[(i+1)%12][1])) {
      if (month === m && day >= d) return i;
    }
  }
  // Simpler fallback
  const boundaries = [
    [3,21],[4,20],[5,21],[6,21],[7,23],[8,23],[9,23],[10,23],[11,22],[12,22],[1,20],[2,19]
  ];
  let idx = 0;
  for (let i = 0; i < 12; i++) {
    const [bm, bd] = boundaries[i];
    if (month === bm && day >= bd) { idx = i; break; }
    if (month === bm && day < bd) { idx = (i + 11) % 12; break; }
    if (month > bm) idx = i;
  }
  return idx;
}

function estimateMoonSign(birthDate) {
  // Moon moves ~13 degrees/day, changes sign every ~2.5 days
  const epoch = new Date('2000-01-06'); // New moon in Capricorn approx
  const diff = Math.floor((birthDate - epoch) / (1000*60*60*24));
  const moonIdx = Math.floor(((diff * 13.18) % 360) / 30);
  return ((moonIdx % 12) + 12) % 12;
}

function estimateRising(birthTime, birthCity) {
  if (!birthTime) return null;
  const [h, m] = birthTime.split(':').map(Number);
  const minutes = h * 60 + m;
  // Rising changes every ~2 hours (roughly 1 sign per 2hrs)
  const idx = Math.floor(minutes / 120) % 12;
  return idx;
}

async function reveal() {
  const name = document.getElementById('name').value.trim();
  const birthDate = document.getElementById('birthDate').value;
  const birthTime = document.getElementById('birthTime').value;
  const birthCity = document.getElementById('birthCity').value.trim();

  const err = document.getElementById('errorMsg');
  err.className = 'error';

  if (!name || !birthDate || !birthCity) {
    err.textContent = 'Please fill in your name, birth date, and birth city.';
    err.className = 'error active';
    return;
  }

  const bd = new Date(birthDate + 'T12:00:00');
  const month = bd.getMonth() + 1;
  const day = bd.getDate();

  const sunIdx = getSunSign(month, day);
  const moonIdx = estimateMoonSign(bd);
  const risingIdx = estimateRising(birthTime, birthCity);

  // Show loading
  document.getElementById('inputCard').style.display = 'none';
  document.getElementById('loading').className = 'loading active';

  const sun = SIGNS[sunIdx];
  const moon = SIGNS[moonIdx];
  const rising = risingIdx !== null ? SIGNS[risingIdx] : null;

  const today = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  const prompt = `You are Stellara, a sophisticated and poetic astrology guide. You combine psychological depth with cosmic wisdom. Your tone is warm, modern, and insightful — never generic.

The user's name is ${name}.
Sun sign: ${sun}
Moon sign: ${moon}
${rising ? `Rising sign: ${rising}` : 'Rising sign: unknown (no birth time provided)'}
Birth city: ${birthCity}
Today's date: ${today}

Write two sections separated by the exact delimiter "---TRANSITS---":

SECTION 1 — BIRTH CHART READING (3–4 paragraphs):
Give a personal, psychologically rich reading of their Sun/Moon${rising ? '/Rising' : ''} combination. Speak directly to ${name}. Highlight the interplay between their placements. Be specific and insightful, not generic. Avoid clichés. Reveal something they might not have heard before.

SECTION 2 — TODAY'S TRANSITS (2–3 paragraphs):
Today is ${today}. Describe the current planetary weather (invent plausible but general transit themes for today — Mercury, Venus, Mars, Jupiter movements) and then specifically connect how this energy interacts with ${name}'s ${sun} Sun and ${moon} Moon. Give them 1-2 concrete things to lean into or watch out for today. Be specific to their chart, not generic horoscope copy.

Write in a flowing, literary style. No bullet points. No headers. Just paragraphs.`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });

    const data = await response.json();
    const text = data.content.map(b => b.text || '').join('');
    const parts = text.split('---TRANSITS---');

    // Render placements
    const placementsHTML = [
      { label: 'Sun', emoji: '☀️', value: sun },
      { label: 'Moon', emoji: '🌙', value: moon },
      { label: 'Rising', emoji: '⬆️', value: rising || '—' }
    ].map(p => `
      <div class="placement-card">
        <div class="placement-emoji">${p.emoji}</div>
        <div class="placement-label">${p.label}</div>
        <div class="placement-value">${p.value}</div>
      </div>
    `).join('');

    document.getElementById('placements').innerHTML = placementsHTML;
    document.getElementById('resultName').textContent = name;
    document.getElementById('chartReading').textContent = parts[0].trim();
    document.getElementById('transitReading').textContent = (parts[1] || '').trim();
    document.getElementById('todayDate').textContent = today;

    document.getElementById('loading').className = 'loading';
    document.getElementById('results').className = 'results card active';

  } catch(e) {
    document.getElementById('loading').className = 'loading';
    document.getElementById('inputCard').style.display = 'block';
    err.textContent = 'Something went wrong. Please try again.';
    err.className = 'error active';
  }
}

function reset() {
  document.getElementById('results').className = 'results card';
  document.getElementById('inputCard').style.display = 'block';
  document.getElementById('name').value = '';
  document.getElementById('birthDate').value = '';
  document.getElementById('birthTime').value = '';
  document.getElementById('birthCity').value = '';
}
</script>
</body>
</html>
