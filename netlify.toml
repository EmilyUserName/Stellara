[build]
  functions = "netlify/functions"

[functions."horoscope"]
  timeout = 60

[functions."daily-email"]
  timeout = 120
  schedule = "0 10 * * *"

[functions."weekly-spread-scheduler"]
  timeout = 120
  schedule = "0 7 * * 1"

[functions."generate-weekly-spread"]
  timeout = 60

# Background function — runs up to 15 minutes, no timeout needed
[functions."generate-weekly-spread-background"]

[functions."operator-cards-scheduler"]
  timeout = 30
  schedule = "0 9 * * *"

# Background function — renders 12 PNG cards + sends operator email
# Uses puppeteer-core + @sparticuz/chromium; excluded from esbuild bundling
[functions."operator-cards-background"]
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]
  node_bundler = "esbuild"

[functions."daily-horoscopes"]
  timeout = 30

[functions."get-weekly-spread"]
  timeout = 30

[functions."solar-return"]
  timeout = 90

[functions."astrocartography"]
  timeout = 15

[functions."astrocartography-interpret"]
  timeout = 20

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/api/calculate-chart"
  to = "/.netlify/functions/calculate-chart"
  status = 200

