[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."horoscope"]
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
