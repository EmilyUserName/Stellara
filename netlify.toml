[build]
  functions = "netlify/functions"

[functions."horoscope"]
  timeout = 26

[functions."daily-email"]
  timeout = 120
  schedule = "0 7 * * *"

[functions."astrocartography"]
  timeout = 15

[functions."astrocartography-interpret"]
  timeout = 20

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/api/calculate-chart"
  to = "/.netlify/functions/calculate-chart"
  status = 200

[[redirects]]
  from = "/api/geocode"
  to = "/.netlify/functions/geocode"
  status = 200

[[redirects]]
  from = "/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/customer-portal"
  to = "/.netlify/functions/customer-portal"
  status = 200

[[redirects]]
  from = "/api/astrocartography"
  to = "/.netlify/functions/astrocartography"
  status = 200

[[redirects]]
  from = "/api/astrocartography-interpret"
  to = "/.netlify/functions/astrocartography-interpret"
  status = 200
